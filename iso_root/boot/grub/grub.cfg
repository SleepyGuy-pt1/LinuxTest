set default=0
set timeout=5

# Force GRUB to keep the BIOS-initialized video buffer
set gfxmode=auto
set gfxpayload=keep

insmod all_video

menuentry "Linux 7.0.1 (Force Kernel Logs)" {
    search --set=root --file /boot/vmlinuz
    # 1. lockdown=none: Prevents security features from blocking console output
    # 2. ignore_loglevel: Forces the kernel to print EVERYTHING (even 'info' level)
    # 3. earlycon=efifb: Tells the kernel to use the EFI buffer for logs immediately
    # 4. console=tty0: Forces the output to the laptop screen
    # 5. nomodeset: Prevents the Intel driver from 'blanking' the screen during handover
    linux /boot/vmlinuz root=/dev/ram0 rw lockdown=none nomodeset earlycon=efifb console=tty0 loglevel=7 ignore_loglevel acpi_rev_override=1
    initrd /boot/initrd.img
}

menuentry "Linux 7.0.1 (Safe Text Mode)" {
    search --set=root --file /boot/vmlinuz
    # This disables the high-res buffer entirely to force old-school VGA text
    linux /boot/vmlinuz root=/dev/ram0 rw nomodeset acpi=off vga=normal console=tty0 earlyprintk=vga
    initrd /boot/initrd.img
}
